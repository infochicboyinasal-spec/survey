<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My ChicBoy Mall Staff Card</title>
<meta name="theme-color" content="#da281c">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--red:#da281c;--yellow:#ffc72d;--off:#fffdf7;--brown:#9b5b09;--ink:#5d3502;--line:rgba(93,53,2,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--off);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--red);padding:28px 16px 24px;text-align:center}.logo{width:200px;max-width:60%;height:auto}
.eyebrow{margin:14px 0 0;color:var(--off);font-weight:800;letter-spacing:.08em;font-size:22px}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
.intro{margin:0 0 8px}.terms{font-size:13px;opacity:.85;margin:0 0 24px}
.terms ul{margin:6px 0 0;padding-left:18px}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
.q h2{font-size:17px;font-weight:800;margin:0 0 4px}.q p.help{margin:0 0 12px;font-size:14px;opacity:.85}.req{color:var(--red)}
.pills{display:flex;flex-wrap:wrap;gap:8px}.pill{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.pill.on{background:var(--ink);color:var(--off)}
input[type=text],input[type=tel]{width:100%;font:inherit;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:15px}label.chk input{flex:0 0 22px;width:22px;height:22px;margin-top:2px;accent-color:var(--red)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.err{color:var(--red);font-size:14px;margin:8px 0 0;display:none}.q.bad .err{display:block}.q.bad{border-color:var(--red)}
.btn{display:block;width:100%;background:var(--red);color:var(--off);border:0;border-radius:999px;padding:16px;font:inherit;font-size:18px;font-weight:800;letter-spacing:.04em;cursor:pointer;text-align:center;text-decoration:none;margin:0 0 12px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.wa{background:#1fa855;color:#fff}
.btn[disabled]{opacity:.6}
.msg{text-align:center}.msg h1{color:var(--red);font-size:28px;font-weight:800;margin:8px 0}
.shot{background:var(--yellow);color:var(--ink);border-radius:999px;display:inline-block;padding:8px 16px;font-weight:800}
/* the staff card */
.card{position:relative;background:var(--red);color:var(--off);border-radius:22px;padding:18px 18px 16px;margin:8px auto 18px;max-width:420px;box-shadow:0 10px 24px rgba(93,53,2,.25);overflow:hidden;text-align:left}
.card:before{content:"";position:absolute;right:-70px;top:-95px;width:190px;height:190px;border-radius:50%;background:var(--yellow);opacity:.95}
.card .top{position:relative;display:flex;justify-content:space-between;align-items:flex-start}
.card .top svg{width:118px;height:auto}
.card .tag{position:relative;background:var(--ink);color:var(--yellow);font-weight:800;letter-spacing:.08em;font-size:12px;padding:5px 10px;border-radius:999px;margin-top:4px}
.card .off{position:relative;font-size:44px;font-weight:800;line-height:1;margin:14px 0 2px;color:var(--off)}
.card .off small{font-size:16px;font-weight:600;letter-spacing:.02em}
.card .who{position:relative;margin:10px 0 12px}
.card .nm{font-size:22px;font-weight:800;line-height:1.15;word-break:break-word}
.card .co{font-size:14px;opacity:.95}
.card .bc{position:relative;background:#fff;border-radius:14px;padding:12px 10px 8px;text-align:center}
.card .bc svg{width:100%;height:84px;display:block}
.card .bc .cd{color:var(--ink);font-weight:800;font-size:24px;letter-spacing:.22em;margin-top:2px}
.card .val{position:relative;font-size:12px;margin-top:8px;opacity:.95;display:flex;justify-content:space-between}
.blocked .bc{filter:grayscale(1);opacity:.35}
.tip{font-size:14px;text-align:center;margin:0 0 14px}

body{background:var(--off)} main{padding-top:20px}
</style></head><body>
<main>
<div id="slot" class="msg"><p>Loading your card...</p></div>
<div id="after" style="display:none">
<p class="tip">Show this screen at the ChicBoy counter. Turn your screen brightness up so the barcode scans easily.</p>
<div id="terms"></div>
<p class="terms" style="text-align:center">Questions? WhatsApp ChicBoy Inasal at <b>058 942 1946</b>.</p>
</div>
</main>
